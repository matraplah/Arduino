<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fizik SPM Interaktif</title>
<meta name="description" content="Nota ringkas, visual interaktif dan latihan SPM bagi Fizik KSSM Tingkatan 4 dan 5.">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Susun atur: buku nota makmal. Satu lajur bacaan (maks 900px) di atas kertas graf;
   senarai bab disusun seperti halaman "Kandungan" buku teks, bukan grid kad. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#131C33; --muted:#586380; --line:#D5DBE8;
  --grid:rgba(33,82,217,.09);
  --accent:#2152D9; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --hl:#FFE066; --hl-ink:#3A2E00;
  --ok:#157A4E; --ok-soft:#DDF3E8; --bad:#BF3327; --bad-soft:#FBE3E0;
  --c2:#D9480F; --c3:#157A4E; --c4:#A0338A;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1322; --surface:#141C30; --ink:#E9EDF7; --muted:#9BA7C2; --line:#27324C;
    --grid:rgba(126,166,255,.11);
    --accent:#7EA6FF; --accent-ink:#0C1322; --accent-soft:#1B2848;
    --hl:#4A3B00; --hl-ink:#FFE9A3;
    --ok:#4CC38A; --ok-soft:#12352A; --bad:#FF8273; --bad-soft:#3B1A17;
    --c2:#FF8A4C; --c3:#4CC38A; --c4:#E07AC8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1322; --surface:#141C30; --ink:#E9EDF7; --muted:#9BA7C2; --line:#27324C;
  --grid:rgba(126,166,255,.11);
  --accent:#7EA6FF; --accent-ink:#0C1322; --accent-soft:#1B2848;
  --hl:#4A3B00; --hl-ink:#FFE9A3;
  --ok:#4CC38A; --ok-soft:#12352A; --bad:#FF8273; --bad-soft:#3B1A17;
  --c2:#FF8A4C; --c3:#4CC38A; --c4:#E07AC8;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* ---------- bar atas ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px;margin-right:auto;white-space:nowrap}
.brand svg{flex:none}
.brand em{font-style:normal;color:var(--accent)}
.top nav{display:flex;gap:4px}
@media (max-width:430px){.brand em{display:none}}
.top nav a{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px}
.top nav a:hover{color:var(--ink);background:var(--bg)}
.top nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* ---------- laman utama ---------- */
.hero{border-bottom:1px solid var(--line);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:36px 32px}
.hero h1{font-size:clamp(34px,6.4vw,58px);font-weight:800;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%)}
.hero p{margin-top:14px;max-width:44ch;color:var(--muted);font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-right:6px}
.hero canvas{display:block;width:100%;height:210px}
@media (max-width:700px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:8px;padding-block:26px 12px}.hero canvas{height:140px}}

.sec{padding-block:30px 6px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-h h2{font-size:26px;font-weight:800}
.sec-h small{color:var(--muted);font-size:14px}
.toc{list-style:none;margin:0;padding:0}
.toc li{border-bottom:1px solid var(--line)}
.toc a{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 4px;text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--surface)}
.toc .no{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.toc .tj{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
.toc .tm{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.toc .st{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.toc .pg{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.toc .pg b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink)}
.toc .pg.done b{color:var(--ok)}
@media (max-width:520px){.toc a{grid-template-columns:40px minmax(0,1fr) auto}.toc .no{font-size:27px}.toc .st{display:none}}

.mix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.mix a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.mix a:hover{border-color:var(--accent)}
.mix b{display:block;font-family:var(--f-display);font-size:17px}
.mix span{font-size:13.5px;color:var(--muted)}
@media (max-width:600px){.mix{grid-template-columns:minmax(0,1fr)}}

.consts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 28px;margin:14px 0 0;padding:0}
.consts div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px dotted var(--line);padding:7px 0;font-size:14.5px}
.consts dt{color:var(--muted)}
.consts dd{margin:0;text-align:right}
.foot{margin-top:40px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.foot .wrap{padding-block:18px 28px}

/* ---------- halaman bab ---------- */
.ch-head{background:var(--surface);border-bottom:1px solid var(--line)}
.ch-head .wrap{padding-block:18px 0}
.back{font-size:14px;font-weight:600;text-decoration:none}
.ch-title{display:flex;gap:16px;align-items:flex-end;margin-top:10px}
.ch-title .no{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,13vw,92px);line-height:.82;color:var(--accent);font-variant-numeric:tabular-nums}
.ch-title .eb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ch-title h1{font-size:clamp(26px,5.2vw,40px);font-weight:800;margin-top:4px}
.ch-intro{margin-top:12px;color:var(--muted);max-width:66ch}
.tabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .sm{display:none}
@media (max-width:560px){.tabs .lg{display:none}.tabs .sm{display:inline}.tabs button{padding-inline:8px;font-size:14.5px}}
.panel{padding-block:24px 8px;display:flex;flex-direction:column;gap:22px}
.panel h2{font-size:23px;font-weight:800}
.panel h3{font-size:18px;font-weight:700}
.lede{color:var(--muted);max-width:68ch}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
.pn a{text-decoration:none;font-weight:600;font-size:15px;max-width:48%}
.pn small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase}

/* matematik */
.m{font-family:var(--f-math);font-size:1.1em}
.m.nw{white-space:nowrap}
.m i{font-style:italic}
.m .up{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .14em;line-height:1.2;font-size:.94em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .22em .06em}
.fr>span:last-child{padding:.04em .22em 0}
.rt>span{border-top:1px solid currentColor;padding:0 .12em;margin-left:-.04em}
.nk{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:right;font-size:.66em;line-height:1.1;margin-right:.06em}
sub,sup{font-size:.72em;line-height:0}
mark{background:var(--hl);color:var(--hl-ink);padding:.05em .3em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* penerangan */
.sub{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 18px;border-top:1px solid var(--line);padding-top:16px}
.sub:first-of-type{border-top:0;padding-top:0}
.sub .sn{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.sub ul{margin:8px 0 0;padding-left:1.15em;display:flex;flex-direction:column;gap:7px;max-width:68ch}
.sub li::marker{color:var(--accent)}
@media (max-width:560px){.sub{grid-template-columns:minmax(0,1fr)}.sub .sn{font-size:22px}}

/* visual interaktif */
.lab{border:1px solid var(--line);background:var(--surface);border-radius:4px;overflow:hidden}
.modes{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.modes button{flex:1 0 auto;background:none;border:0;border-right:1px solid var(--line);padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.modes button:last-child{border-right:0}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.stage{background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;border-bottom:1px solid var(--line)}
.stage canvas{display:block;width:100%;touch-action:pan-y}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));margin:0;border-bottom:1px solid var(--line)}
.reads div{padding:9px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px;min-width:0}
.reads dt{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.3}
.reads dd{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 26px;padding:14px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;min-width:0}
.ctl label{font-size:14px;font-weight:600}
.ctl output{font-size:14px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;white-space:nowrap}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:4px 0 0;height:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.row>span{font-size:14px;font-weight:600;margin-right:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:7px 14px;font-weight:600;font-size:14.5px;cursor:pointer;line-height:1.3}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.cuba{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.cuba li::marker{font-family:var(--f-display);font-weight:800;color:var(--accent)}
.cuba details{margin-top:4px}
.cuba summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px}
.cuba details p{margin-top:4px;color:var(--muted)}

/* latihan */
.score{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:3}
.score b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.bar{flex:1 1 120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.q{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.q .qh{display:flex;gap:10px;align-items:baseline}
.q .qn{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--accent);flex:none;min-width:1.6em;font-variant-numeric:tabular-nums}
.q .src{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:9px 12px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{font-family:var(--f-display);color:var(--muted);flex:none}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok b{color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no b{color:var(--bad)}
.fb{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:15px}
.fb.ok{border-color:var(--ok)}
.fb.no{border-color:var(--bad)}
.fb strong{display:block;font-family:var(--f-display)}
.fb.ok strong{color:var(--ok)}
.fb.no strong{color:var(--bad)}
.parts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.parts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
.parts .mk{font-size:13px;color:var(--muted);white-space:nowrap;font-style:italic}
.parts .ans{grid-column:1/-1;background:var(--ok-soft);border-radius:4px;padding:8px 12px;font-size:15px}
.parts .ans::before{content:"Skema: ";font-weight:700;color:var(--ok)}
.done{border:1px solid var(--ok);background:var(--ok-soft);border-radius:4px;padding:14px 16px}
.done b{font-family:var(--f-display);font-size:20px}

/* nota & rumusan */
.scroll{overflow-x:auto}
table.rumus{border-collapse:collapse;width:100%;min-width:480px;font-size:15px}
table.rumus th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 12px 6px 0;border-bottom:2px solid var(--ink)}
table.rumus td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.rumus td:first-child{white-space:nowrap;font-size:17px;padding-right:22px}
dl.ist{margin:0;display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:0 18px}
dl.ist dt{font-weight:700;padding:9px 0;border-bottom:1px solid var(--line)}
dl.ist dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){dl.ist{grid-template-columns:minmax(0,1fr)}dl.ist dt{border-bottom:0;padding-bottom:0}dl.ist dd{padding-top:2px}}
ol.rum{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px;max-width:70ch}
ol.rum li{counter-increment:r;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px}
ol.rum li::before{content:counter(r);font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);line-height:1.3;font-variant-numeric:tabular-nums}
ul.awas{margin:0;padding:14px 16px 14px 34px;background:var(--bad-soft);border-radius:4px;display:flex;flex-direction:column;gap:7px;max-width:72ch}
ul.awas li::marker{color:var(--bad)}


/* ---------- cara guna ---------- */
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:st}
.steps li{counter-increment:st;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.steps li::before{content:counter(st);font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);line-height:1}
.steps b{font-family:var(--f-display);font-size:16px}
.steps span{font-size:13.5px;color:var(--muted);line-height:1.45}
@media (max-width:760px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.steps{grid-template-columns:minmax(0,1fr)}}

/* ---------- penerangan ---------- */
.chip-spm{display:inline-block;font-style:normal;font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.06em;line-height:1;padding:4px 6px 3px;border-radius:3px;background:var(--c2);color:#fff;vertical-align:2px}
:root[data-theme="dark"] .chip-spm{color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip-spm{color:var(--bg)}}
ul.isi{list-style:none;padding-left:0}
ul.isi li{position:relative;padding-left:18px}
ul.isi li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
ul.isi li.kerap::before{background:var(--c2)}
ul.isi li .chip-spm{margin-left:6px}
.ingat{margin-top:12px;background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:9px 12px;max-width:68ch}
.contoh{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.contoh .eb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
ol.langkah{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
ol.langkah:empty{display:none}
ol.langkah li::marker{font-family:var(--f-display);font-weight:800;color:var(--accent)}
ol.langkah li.jwp{list-style:none;margin-left:-1.4em;background:var(--ok-soft);border-radius:4px;padding:8px 12px}

/* ---------- fokus SPM ---------- */
ul.topik{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
ul.topik li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.bintang{color:var(--c2);letter-spacing:1px;font-size:15px;white-space:nowrap}
.bintang s{text-decoration:none;color:var(--line)}

<script>
'use strict';
/* ===== Fizik SPM Interaktif: enjin laman ===== */
const BAB = [];   // diisi oleh data-t4.js dan data-t5.js
const SIMS = {};  // diisi oleh sims.js

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('fz:' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('fz:' + k, JSON.stringify(v)); } catch (e) { /* storan tidak tersedia */ } }
};

/* ---- Penulisan rumus ringkas: $v = u + at$, {a}/{b} pecahan, _ subskrip, ^ superskrip,
        sqrt{..} punca kuasa dua, nuk{A}{Z}{X} nuklid, "teks" tegak ---- */
function math(s) {
  let i = 0;
  const E = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const R = t => t.replace(/(sin|kos|tan|log|maks|min)|([A-Za-zα-ω]+)|([&<>])|(-)/g,
    (m, fn, v, x, h) => fn ? '<span class="up">' + fn + '</span>' : v ? '<i>' + v + '</i>' : h ? '−' : E(x));
  function grp() { i++; const h = seq('}'); i++; return h; }
  function quote() { const j = s.indexOf('"', i + 1); const t = s.slice(i + 1, j); i = j + 1; return '<span class="up">' + E(t) + '</span>'; }
  function atom() {
    if (s[i] === '{') return grp();
    if (s[i] === '"') return quote();
    const m = /^[-−+]?\d+|^./u.exec(s.slice(i)); i += m[0].length; return R(m[0]);
  }
  function seq(end) {
    let o = '';
    while (i < s.length && s[i] !== end) {
      const c = s[i];
      if (c === '{') {
        const a = grp();
        if (s[i] === '/' && s[i + 1] === '{') { i++; const b = grp(); o += '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>'; }
        else o += a;
      }
      else if (c === '_') { i++; o += '<sub>' + atom() + '</sub>'; }
      else if (c === '^') { i++; o += '<sup>' + atom() + '</sup>'; }
      else if (c === '"') { o += quote(); }
      else if (s.startsWith('sqrt{', i)) { i += 4; o += '<span class="rt">√<span>' + grp() + '</span></span>'; }
      else if (s.startsWith('nuk{', i)) {
        i += 3; const A = grp(), Z = grp(), X = grp();
        o += '<span class="nk"><span>' + A + '</span><span>' + Z + '</span></span><span class="up">' + X.replace(/<\/?i>/g, '') + '</span>';
      }
      else {
        let j = i + 1;
        while (j < s.length && !'{}_^"'.includes(s[j]) && s[j] !== end && !s.startsWith('sqrt{', j) && !s.startsWith('nuk{', j)) j++;
        o += R(s.slice(i, j)); i = j;
      }
    }
    return o;
  }
  return '<span class="m' + (s.length <= 34 ? ' nw' : '') + '">' + seq(null) + '</span>';
}
/* Teks kandungan: $...$ rumus, **tebal**, ==serlah== */
function fmt(t) {
  const ms = [];
  const s = String(t).replace(/\$([^$]+)\$/g, (m, x) => { ms.push(math(x)); return '\u0001' + (ms.length - 1) + '\u0002'; })
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>');
  return s.replace(/\u0001(\d+)\u0002/g, (m, k) => ms[+k]);
}

/* ---------- keadaan ---------- */
const app = document.getElementById('app');
let stopSim = null, stopHero = null;
const TABS = [['terang', 'Penerangan', 'Isi'], ['visual', 'Visual', 'Visual'], ['fokus', 'Fokus SPM', 'Fokus SPM'], ['latih', 'Latihan', 'Latihan'], ['nota', 'Rumusan', 'Rumusan']];
let curTab = store.get('tab2');
if (!TABS.some(t => t[0] === curTab)) curTab = 'terang';
const semuaKuiz = b => (b.kuizTambah || []).concat(b.kuiz);

function cleanup() {
  if (stopSim) { stopSim(); stopSim = null; }
  if (stopHero) { stopHero(); stopHero = null; }
  if (stopGuru) { stopGuru(); stopGuru = null; }
}

/* ---------- laman utama ---------- */
function viewHome() {
  const nq = BAB.reduce((n, b) => n + semuaKuiz(b).length + b.struktur.length + (b.reka ? 1 : 0), 0);
  const nsim = BAB.reduce((n, b) => n + (b.sim.n || 1), 0);
  const toc = ting => BAB.filter(b => b.ting === ting).map(b => {
    const s = Game.bab(b);
    return `<li><a href="#${b.id}"><span class="no">${b.no}</span>
      <span><span class="tm">${b.tema}</span><span class="tj">${b.tajuk}</span><span class="st">${b.sub.map(x => x.n + ' ' + x.t).join(' · ')}</span></span>
      <span class="pg${s.tamat ? ' done' : ''}">${bintangHtml(s.bintang)}<b class="num">${s.pts}<small>/${s.max}</small></b>${s.done ? s.done + '/' + s.total + ' dijawab' : 'belum dicuba'}</span></a></li>`;
  }).join('');
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <div>
      <h1>Fizik SPM <span>Interaktif</span></h1>
      <p>Penerangan ringkas, isi yang kerap keluar SPM dan latihan bertahap untuk semua bab Fizik KSSM Tingkatan 4 dan Tingkatan 5.</p>
      <ul class="stats"><li><b class="num">${BAB.length}</b>bab</li><li><b class="num">${nsim}</b>visual interaktif</li><li><b class="num">${nq}</b>soalan latihan</li></ul>
    </div>
    <canvas id="hero-cv" aria-hidden="true"></canvas>
  </div></section>
  <div class="wrap">

function heroAnim(cv) {
  const c = cv.getContext('2d'); let raf = 0, t = 0, last = performance.now(), dead = false;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ts) {
    if (dead) return;
    const w = cv.clientWidth, h = cv.clientHeight, d = Math.min(window.devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
    if (!still) t += Math.min((ts - last) / 1000, .05); last = ts;
    const K = col(), x0 = 26, y0 = h / 2, A = h * .3, lam = Math.max(110, w * .42), k = 2 * Math.PI / lam;
    G.line(c, x0, 10, x0, h - 10, K.ink, 1.5); G.line(c, x0, y0, w - 8, y0, K.ink, 1.5);
    const pts = []; for (let x = x0; x <= w - 8; x += 3) pts.push([x, y0 - A * Math.sin(k * (x - x0) - t * 2.2)]);
    G.curve(c, pts, K.a, 3);
    for (let x = x0 + 24; x <= w - 10; x += 24) G.dot(c, x, y0 - A * Math.sin(k * (x - x0) - t * 2.2), 3.4, K.c2);
    let xc = ((Math.PI / 2 + t * 2.2) / k) % lam; if (xc < 14) xc += lam;
    if (x0 + xc + lam < w - 6) {
      const ya = y0 - A - 12;
      G.arrow(c, x0 + xc + lam / 2, ya, x0 + xc, ya, K.ink, 1.4); G.arrow(c, x0 + xc + lam / 2, ya, x0 + xc + lam, ya, K.ink, 1.4);
      G.text(c, 'λ', x0 + xc + lam / 2, ya - 9, K.ink, 'center', 15, 700);
    }
    G.arrow(c, x0 + xc, y0, x0 + xc, y0 - A, K.c3, 1.6); G.text(c, 'A', x0 + xc + 9, y0 - A / 2, K.c3, 'left', 14, 700);
    G.text(c, 'sesaran', x0 + 6, 12, K.mut, 'left', 11.5, 600); G.text(c, 'jarak', w - 10, y0 + 13, K.mut, 'right', 11.5, 600);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  return () => { dead = true; cancelAnimationFrame(raf); };
}

   Jawapan disimpan dalam storan pelayar (fz:jaw:<bab>) dan dikunci selepas disemak. */
const MATA_SOALAN = 10;           // setiap soalan objektif betul
const MATA_MARKAH_REKA = 5;       // setiap markah soalan reka bentuk (10 markah = 50 mata)
const PANGKAT = [
  [0, 'Pemula'], [100, 'Perantis Fizik'], [300, 'Penyiasat Muda'], [600, 'Jurutera Muda'],
  [1000, 'Saintis'], [1500, 'Pakar Fizik'], [1900, 'Profesor Fizik']
];
const LENCANA = [
  ['mula', 'Langkah Pertama', 'Jawab betul soalan pertama'],
  ['tepat5', 'Tepat Lima', '5 jawapan betul berturut-turut'],
  ['tepat10', 'Penembak Tepat', '10 jawapan betul berturut-turut'],
  ['tamat', 'Tamat Bab', 'Jawab semua soalan dalam satu bab'],
  ['sempurna', 'Bab Sempurna', 'Mata penuh dalam satu bab'],
  ['pereka', 'Pereka Hebat', 'Markah penuh soalan reka bentuk'],
  ['t4', 'Juara Tingkatan 4', 'Tamat semua bab Tingkatan 4'],
  ['t5', 'Juara Tingkatan 5', 'Tamat semua bab Tingkatan 5']
];

/* ---------- profil murid (log masuk dengan no. IC) ----------
   No. IC penuh TIDAK disimpan. Dokumen pangkalan data dinamakan dengan cincangan SHA-256 IC;
   hanya nama dan 4 digit terakhir IC disimpan untuk paparan guru. */
let DB = null, PENGGUNA = null, dbSedia = null, Profil = null, simpanQ = Promise.resolve(), simpanGagal = false;
function dbMula() {
  if (dbSedia) return dbSedia;
  const tamat = new Promise(r => setTimeout(() => r(null), 10000));
  const ambil = n => (window.claude && window.claude.use) ? Promise.race([window.claude.use(n).catch(() => null), tamat]) : Promise.resolve(null);
  dbSedia = Promise.all([ambil('db'), ambil('user')]).then(([d, u]) => { DB = d; PENGGUNA = u; return d; });
  return dbSedia;
}
const icBersih = v => String(v || '').replace(/\D/g, '');
function icSah(ic) {
  if (!/^\d{12}$/.test(ic)) return 'No. IC mesti 12 digit, contoh 080512-10-1234.';
  const bln = +ic.slice(2, 4), hr = +ic.slice(4, 6);
  if (bln < 1 || bln > 12 || hr < 1 || hr > 31) return 'Enam digit pertama mesti tarikh lahir yang sah (TTBBHH).';
  return '';
}
async function icCincang(ic) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fizik-spm-interaktif|' + ic));
  return [...new Uint8Array(buf)].slice(0, 16).map(x => x.toString(16).padStart(2, '0')).join('');
}
const dataKosong = () => ({ jaw: {}, streak: { now: 0, best: 0 }, lencana: [] });
function dariDok(o) { return { jaw: o && o.jaw ? JSON.parse(JSON.stringify(o.jaw)) : {}, streak: o && o.streak ? { ...o.streak } : { now: 0, best: 0 }, lencana: o && o.lencana ? [...o.lencana] : [] }; }

const Akaun = {
  /* murid hanya boleh masuk jika IC telah didaftarkan oleh guru */
  async masuk(icMentah) {
    const r = await API.muridMasuk(icMentah); if (r.salah) return r;
    this.pasang(r.token, r.profil);
    try { sessionStorage.setItem('fz:sesi', JSON.stringify({ token: r.token })); } catch (e) { /* abaikan */ }
    hud(); this.kedudukan();
    return {};
  },
  pasang(token, p) { Profil = { token, nama: p.nama || '', kelas: p.kelas || '', ic4: p.ic4 || '', data: dariDok(p), ked: null }; },
  /* pulihkan sesi selepas muat semula halaman (tab yang sama sahaja) */
  async pulih() {
    let s = null; try { s = JSON.parse(sessionStorage.getItem('fz:sesi')); } catch (e) { s = null; }
    if (!s || !s.token) return false;
    const p = await API.muridSaya(s.token);
    if (!p) { this.keluar(); return false; }
    this.pasang(s.token, p); this.kedudukan();
    return true;
  },
  keluar() { if (Profil) API.muridKeluar(Profil.token); Profil = null; try { sessionStorage.removeItem('fz:sesi'); } catch (e) { /* abaikan */ } hud(); },
  /* hanya medan kemajuan; nama, IC dan kelas diurus oleh guru */
  dok() {
    let dijawab = 0, item = 0;
    BAB.forEach(b => { const x = Game.bab(b); dijawab += x.done; item += x.total; });
    const jumlah = Game.total(), max = Game.max();
    return { jaw: Profil.data.jaw, streak: Profil.data.streak, lencana: Profil.data.lencana, jumlah, peratusMarkah: Math.round(jumlah / max * 100), kemajuan: Math.round(dijawab / item * 100), babTamat: BAB.filter(b => Game.bab(b).tamat).length, kemaskini: Date.now() };
  },
  /* simpan satu demi satu; pelayan Netlify memulangkan profil yang telah disemaknya sendiri */
  simpan() {
    if (!Profil) return Promise.resolve();
    const P = Profil, body = this.dok();
    simpanQ = simpanQ.then(() => API.muridSimpan(P.token, body)).then(p => {
      if (p && Profil === P) P.data = dariDok(p);
      if (simpanGagal) { simpanGagal = false; statusSimpan(); }
      this.kedudukan();
    }).catch(() => { simpanGagal = true; statusSimpan(); });
    return simpanQ;
  },
  /* kedudukan dalam kelas sendiri; toast apabila mendapat gelaran baharu */
  async kedudukan() {
    if (!Profil) return null;
    const P = Profil, senarai = await API.kedudukan(P.token, P.kelas);
    if (!senarai || Profil !== P) return null;
    const saya = senarai.find(x => x.saya) || null, lama = P.ked && P.ked.saya;
    P.ked = { senarai, saya };
    if (lama && saya && saya.gelaran && saya.gelaran !== lama.gelaran && saya.kedudukan < lama.kedudukan) toast(`Tahniah! Anda kini ${saya.gelaran} (#${saya.kedudukan})`, 'naik');
    hud(); kemasKedudukan();
    return P.ked;
  }
};
function statusSimpan() {
  const n = document.getElementById('simpan-nota'); if (!n) return;
  n.hidden = !simpanGagal;
  n.textContent = 'Markah terkini belum dapat disimpan ke pangkalan data. Ia akan dihantar semula semasa semakan seterusnya; jangan log keluar dahulu.';
}

const Game = {
  load(id) { const d = Profil && Profil.data.jaw[id]; return d && d.q ? JSON.parse(JSON.stringify(d)) : { q: {}, reka: null }; },
  save(id, d) { if (!Profil) return; Profil.data.jaw[id] = d; },
  rekaMax(b) { return b.reka ? (b.reka.aspek.length * 2 + 2) * MATA_MARKAH_REKA : 0; },
  bab(b) {
    const d = this.load(b.id), qs = semuaKuiz(b);
    let pts = 0, done = 0, ok = 0;
    qs.forEach((q, i) => { if (d.q[i] != null) { done++; if (d.q[i] === q.a) { ok++; pts += MATA_SOALAN; } } });
    if (d.reka) { done++; pts += d.reka.m * MATA_MARKAH_REKA; }
    const max = qs.length * MATA_SOALAN + this.rekaMax(b), total = qs.length + (b.reka ? 1 : 0);
    const f = pts / max;
    return { pts, max, done, total, ok, tamat: done === total, bintang: f >= .9 ? 3 : f >= .7 ? 2 : f >= .4 ? 1 : 0 };
  },
  total() { return BAB.reduce((n, b) => n + this.bab(b).pts, 0); },
  max() { return BAB.reduce((n, b) => n + this.bab(b).max, 0); },
  pangkat(p) {
    let i = 0; PANGKAT.forEach((x, k) => { if (p >= x[0]) i = k; });
    const nx = PANGKAT[i + 1];
    return { nama: PANGKAT[i][1], aras: i + 1, seterusnya: nx ? nx[1] : null, perlu: nx ? nx[0] - p : 0, frac: nx ? (p - PANGKAT[i][0]) / (nx[0] - PANGKAT[i][0]) : 1 };
  },
  streak() { return Profil ? Profil.data.streak : { now: 0, best: 0 }; },
  lencanaDapat() {
    const s = this.streak(), st = BAB.map(b => [b, this.bab(b)]);
    const got = new Set();
    if (st.some(([, x]) => x.ok > 0)) got.add('mula');
    if (s.best >= 5) got.add('tepat5');
    if (s.best >= 10) got.add('tepat10');
    if (st.some(([, x]) => x.tamat)) got.add('tamat');
    if (st.some(([, x]) => x.pts === x.max)) got.add('sempurna');
    if (st.some(([b]) => { const d = this.load(b.id); return d.reka && b.reka && d.reka.m === b.reka.aspek.length * 2 + 2; })) got.add('pereka');
    if (st.filter(([b]) => b.ting === 4).every(([, x]) => x.tamat)) got.add('t4');
    if (st.filter(([b]) => b.ting === 5).every(([, x]) => x.tamat)) got.add('t5');
    return got;
  },
  /* panggil selepas setiap semakan: simpan, kemas kini HUD, tunjuk toast mata, pangkat & lencana baharu */
  lepasSemak(mata, betul, sebelum) {
    if (!Profil) return;
    if (betul != null) { const s = Profil.data.streak; s.now = betul ? s.now + 1 : 0; s.best = Math.max(s.best, s.now); }
    const t = this.total(), p0 = this.pangkat(sebelum), p1 = this.pangkat(t);
    toast(mata > 0 ? `+${mata} mata` : 'Tiada mata', mata > 0 ? 'ok' : 'no');
    const s = this.streak(); if (betul && s.now >= 3) toast(`${s.now} betul berturut-turut`, 'api');
    if (p1.aras > p0.aras) toast(`Naik pangkat: ${p1.nama}`, 'naik');
    const lama = new Set(Profil.data.lencana), baru = this.lencanaDapat();
    LENCANA.forEach(([k, n]) => { if (baru.has(k) && !lama.has(k)) toast(`Lencana baharu: ${n}`, 'naik'); });
    Profil.data.lencana = [...baru];
    Akaun.simpan();
    hud();
    const st = document.querySelector('.bab-st'), b = BAB.find(x => x.id === location.hash.slice(1));
    if (st && b) st.outerHTML = babStatusHtml(b);
  }
};

function bintangHtml(n) { return `<span class="bintang" aria-label="${n} bintang">${'★'.repeat(n)}<s>${'★'.repeat(3 - n)}</s></span>`; }

function hud() {
  const h = document.getElementById('hud'); if (!h) return;
  if (!Profil) { h.innerHTML = '<b class="masuk-l">Log masuk</b>'; h.href = '#masuk'; h.setAttribute('aria-label', 'Log masuk dengan no. IC'); return; }
  const t = Game.total(), pk = Game.pangkat(t);

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastBox = null;
function toast(msg, kind) {
  if (!toastBox) { toastBox = el('div', 'toasts'); toastBox.setAttribute('aria-live', 'polite'); document.body.append(toastBox); }
  const t = el('div', 'toast ' + (kind || ''), msg); toastBox.append(t);
  while (toastBox.children.length > 3) toastBox.firstChild.remove();
  setTimeout(() => { t.classList.add('pergi'); setTimeout(() => t.remove(), 400); }, 1900);
}

/* kad profil di laman utama */

function kedHtml() {

/* ---------- soalan objektif (mod permainan atau latihan bebas) ---------- */
function mcq(host, qs, opt) {
  opt = opt || {};
  const b = opt.bab, game = !!b;
  host.innerHTML = ''; host.style.cssText = 'display:flex;flex-direction:column;gap:18px';
  const d = game ? Game.load(b.id) : { q: {} };
  const sc = el('div', 'score');
  const upd = () => {
    let done = 0, right = 0; qs.forEach((q, i) => { if (d.q[i] != null) { done++; if (d.q[i] === q.a) right++; } });
    sc.innerHTML = game
      ? `<span>Betul <b class="num">${right}/${qs.length}</b></span><span class="bar"><i style="width:${done / qs.length * 100}%"></i></span><span class="sc-m"><b class="num">${right * MATA_SOALAN}</b> mata</span>`
      : `<span>Betul <b class="num">${right}/${qs.length}</b></span><span class="bar"><i style="width:${done / qs.length * 100}%"></i></span><button type="button" class="btn ghost">Soalan baharu</button>`;
    if (!game) sc.querySelector('button').onclick = opt.again;
    return { done, right };
  };
  host.append(sc); upd();
  const kunci = (card, box, q, pilihan) => {
    box.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.setAttribute('aria-pressed', 'false'); if (x.dataset.ok) x.classList.add('ok'); if (+x.dataset.oi === pilihan && pilihan !== q.a) x.classList.add('no'); });
    const ok = pilihan === q.a;
    const fb = el('div', 'fb ' + (ok ? 'ok' : 'no'), `<strong>${ok ? 'Betul' : 'Salah'}${game ? ` · ${ok ? '+' + MATA_SOALAN : '0'} mata` : ''}</strong>${fmt(q.e)}`); fb.setAttribute('role', 'status');
    const act = card.querySelector('.q-act'); if (act) act.replaceWith(fb); else card.append(fb);
    card.classList.add('dikunci');
  };
  qs.forEach((q, n) => {
    const card = el('div', 'q', `<div class="qh"><span class="qn">${n + 1}</span><div>${q.src ? `<div class="src">${q.src}</div>` : ''}<div>${fmt(q.q)}</div></div></div><div class="opts"></div>`);
    const box = card.querySelector('.opts'); let pilih = null;
    const order = d.q[n] != null ? [0, 1, 2, 3] : shuffle([0, 1, 2, 3]);
    order.forEach((oi, k) => {
      const bt = el('button', 'opt', `<b>${'ABCD'[k]}</b><span>${fmt(q.o[oi])}</span>`); bt.type = 'button';
      bt.dataset.ok = oi === q.a ? '1' : ''; bt.dataset.oi = oi; bt.setAttribute('aria-pressed', 'false');
      bt.onclick = () => { pilih = oi; box.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === bt)); semak.disabled = false; };
      box.append(bt);
    });
    const act = el('div', 'row q-act', `<button type="button" class="btn" disabled>Semak jawapan</button><span class="q-hint">Pilih satu jawapan dahulu. Jawapan tidak boleh diubah selepas disemak.</span>`);
    const semak = act.querySelector('button');
    semak.onclick = () => {
      if (pilih == null) return;
      const sebelum = game ? Game.total() : 0;
      d.q[n] = pilih; if (game) Game.save(b.id, d);
      kunci(card, box, q, pilih);
      const r = upd();
      if (game) Game.lepasSemak(pilih === q.a ? MATA_SOALAN : 0, pilih === q.a, sebelum);
      if (r.done === qs.length) selesai();
    };
    card.append(act);
    if (d.q[n] != null) kunci(card, box, q, d.q[n]);
    host.append(card);
  });
  function selesai() {
    const { right } = upd(), pct = right / qs.length;
    const old = host.querySelector('.done'); if (old) old.remove();
    host.append(el('div', 'done', `<b class="num">Bahagian A selesai: ${right}/${qs.length} betul${game ? ` · ${right * MATA_SOALAN} mata` : ''}</b><p>${pct === 1 ? 'Semua betul. Hebat!' : pct >= .6 ? 'Baik. Baca semula penjelasan bagi soalan yang salah.' : 'Ulang kaji tab Penerangan dan Fokus SPM, kemudian cuba Kuiz campuran untuk latihan tambahan.'}</p>`));
  }
  if (upd().done === qs.length) selesai();
}

    asp.querySelectorAll('.asp-r').forEach((row, i) => {

  };

}

'use strict';
/* ===== Halaman guru: kata laluan, pendaftaran murid, markah =====
   Kata laluan disimpan sebagai cincangan PBKDF2 (bukan teks asal) dalam tetapan/guru.
   Rekod murid: pelajar/<cincangan IC> = { ic, nama, kelas, didaftar, ...kemajuan } */
const ITER = 150000;
let stopGuru = null, guruToken = null;
try { guruToken = sessionStorage.getItem('fz:guru2') || null; } catch (e) { guruToken = null; }

async function kataCincang(kata, garam) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(kata), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(garam), iterations: ITER }, k, 256);
  return [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const garamBaru = () => [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, '0')).join('');
function setGuru(t) { guruToken = t || null; try { if (t) sessionStorage.setItem('fz:guru2', t); else sessionStorage.removeItem('fz:guru2'); } catch (e) { /* abaikan */ } }

/* rekod murid baharu / kemas kini nama & kelas (kemajuan tidak disentuh) */
async function daftarMuridDb(icMentah, nama, kelas) {
  const ic = icBersih(icMentah), salah = icSah(ic);
  if (salah) throw new Error(salah);
  nama = String(nama || '').trim().replace(/\s+/g, ' '); kelas = String(kelas || '').trim().toUpperCase().replace(/\s+/g, ' ');
  if (nama.length < 3) throw new Error('Nama terlalu pendek.');
  if (!kelas) throw new Error('Kelas mesti diisi.');
  const hash = await icCincang(ic), ref = DB.doc('pelajar/' + hash), cur = await ref.get();
  if (cur.exists) { await ref.update({ ic, nama, kelas }); return 'kemas'; }
  await ref.set({ ic, nama, kelas, didaftar: Date.now(), jaw: {}, streak: { now: 0, best: 0 }, lencana: [], jumlah: 0, peratusMarkah: 0, kemajuan: 0, babTamat: 0, kemaskini: null });
  return 'baru';
}

/* ---- bekas makmal: kanvas + bacaan + kawalan ---- */
function Lab(host, id, opt = {}) {
  host.innerHTML = '';
  const stage = el('div', 'stage'), cv = el('canvas'), reads = el('dl', 'reads'), ctrl = el('div', 'ctrls');
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', opt.alt || 'Visual interaktif');

    const h = Math.round(Math.min(Math.max(w * r, 230), opt.max || 470)), d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * d); cv.height = Math.round(h * d); cv.style.height = h + 'px';

  const fire = () => { if (L.changed) L.changed(); L.redraw(); };
  L.slider = o => {
    const w = el('div', 'ctl'), sid = id + '-' + o.id;
    w.innerHTML = `<label for="${sid}">${o.label}</label><output for="${sid}"></output><input type="range" id="${sid}" min="${o.min}" max="${o.max}" step="${o.step || 1}" value="${o.val}">`;
    const inp = w.querySelector('input'), out = w.querySelector('output');
